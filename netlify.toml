[build.environment]
  # These are non-secret "mode selector" config values (e.g. ODDS_PROVIDER = "theoddsapi"),
  # not credentials. Netlify's secrets scanner does a naive substring search for each env
  # var's *value* across the build output, and these particular values also happen to
  # appear verbatim in our own source code as ordinary string comparisons
  # (lib/odds/index.ts, lib/rosters/index.ts) or are just the word "production" -- so they
  # false-positive as "leaked secrets" when they're really just our own code. Real secrets
  # (DATABASE_URL, AUTH_SECRET, ODDS_API_KEY) are high-entropy and won't collide with our
  # source like this, so they intentionally stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "ODDS_PROVIDER,ROSTER_PROVIDER,SHARPAPI_PROVIDER,PARLAYAPI_PROVIDER,NODE_ENV"
  # Turbopack's persistent build cache records the literal value of every env var it reads
  # (for cache-invalidation fingerprinting), so real secrets like AUTH_SECRET/ODDS_API_KEY
  # do genuinely end up in these .sst cache files. That's expected Turbopack behavior, not
  # a leak -- the cache is disposable build bookkeeping, never served to anyone -- so it's
  # excluded from the path scan entirely, rather than exempting the secret *keys* above
  # (which would also blind the scanner to a real leak if one of these ever showed up in
  # actual served output, e.g. a served JS chunk).
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
